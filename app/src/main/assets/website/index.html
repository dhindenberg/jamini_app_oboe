<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<title>MIDI Synth Controller</title>
	<style>
		body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            margin: 10px;
        }
	</style>
	<script>
		function playPiano() {
            const note = Math.floor(Math.random() * 30) + 30;
            SoundInterface.playPiano(note, 127, 500);
        }

        function playBass() {
            const note = Math.floor(Math.random() * 30) + 30;
            SoundInterface.playBass(note, 100, 700);
        }

        function playDrum() {
            const note = Math.floor(Math.random() * 30) + 30;
            SoundInterface.playDrum(note, 127, 200);
        }
	</script>
</head>
<body>
<h1>MIDI Synth Controller</h1>

<button onclick="playPiano()">🎹 Piano spielen</button>
<button onclick="playBass()">🎸 Bass spielen</button>
<button onclick="playDrum()">🥁 Drums spielen</button>
</body>
</html>
